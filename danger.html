<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>海邊危險度判斷小工具</title>
  <style>
    :root{
      --bg:#91d1e2;--card:#77b7b7;--muted:#1a3434;--accent:#55d3ff;
      --good:#2ecc71;--warn:#e9cf64;--bad:#e74c3c;
    }
    *{box-sizing:border-box}
    body{
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Noto Sans TC",sans-serif;
      line-height:1.6;
      background:linear-gradient(180deg,#B3D9D9);
      color:#07505f;
      margin:0;
      font-size:18px; /* 整體字體放大 */
    }
    .container{
      max-width:1200px;   /* 寬度放大 */
      margin:32px auto;
      padding:0 24px;     /* 左右留白縮小一點 */
    }
    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:20px;
    }
    h1{
      font-weight:800;
      letter-spacing:0.5px;
      margin:0;
      font-size:clamp(28px,3.5vw,40px); /* 標題變大 */
    }
    .card{
      background:var(--card);
      border:1px solid rgba(255,255,255,0.06);
      box-shadow:0 10px 30px rgba(0,0,0,.35);
      border-radius:18px;
      padding:28px; /* 放大內距 */
      margin-bottom:20px;
    }
    .controls{display:grid;grid-template-columns:1fr;gap:12px}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    button,input,select{font:inherit;font-size:16px}
    button{
      cursor:pointer;
      background:#336666;
      border:1px solid rgba(255,255,255,0.1);
      color:#fff;
      padding:12px 18px;
      border-radius:12px;
      font-weight:600;
      transition:background 0.2s,transform 0.2s;
    }
    button:hover{background:#336666;transform:translateY(-2px)}
    label{font-size:16px;color:var(--muted)}
    input[type="number"]{
      width:140px;
      padding:10px 12px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,.12);
      background:#336666;
      color:#fff;
      font-size:16px;
    }
    .pill{
      display:inline-flex;align-items:center;gap:6px;
      padding:6px 12px;
      border-radius:999px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.08);
      font-size:14px;
      color:#336666
    }
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
    .meter{height:16px;border-radius:999px;background:#3b96b0;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.07)}
    .bar{position:absolute;inset:0;transform-origin:left center;scale:0 1;transition:scale .5s ease}
    .bar.low{background:linear-gradient(90deg,var(--good),#77dd77)}
    .bar.mid{background:linear-gradient(90deg,var(--warn),#ffdf6b)}
    .bar.high{background:linear-gradient(90deg,var(--bad),#ff7b7b)}
    .score{font-weight:800}
    .status{font-weight:900;font-size:26px}
    .status.low{color:var(--good)} .status.mid{color:var(--warn)} .status.high{color:var(--bad)}
    .muted{color:var(--muted)}
    footer{margin-top:24px;color:#336666;font-size:14px}
    .small{font-size:14px}
    .hidden{display:none}
    .badgelist{display:flex;flex-wrap:wrap;gap:8px}
    .tips{font-size:16px;color:#336666}
    .hr{height:1px;background:rgba(255,255,255,.08);margin:16px 0}
    .link{color:var(--accent);text-decoration:none}
    /* 返回按鈕 */
    .back-btn{
      display:inline-block;
      padding:14px 28px;
      background:#336666;
      color:#ffffff;
      border-radius:12px;
      text-decoration:none;
      font-weight:600;
      font-size:18px;
      box-shadow:0 4px 10px rgba(0,0,0,.3);
      transition:background 0.3s,transform 0.2s;
    }
    .back-btn:hover{background:#336666;transform:translateY(-2px)}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>海邊危險度判斷</h1>
      <a class="link small" href="https://open-meteo.com/en/docs" target="_blank" rel="noopener">資料來源：Open-Meteo</a>
    </header>

    <div class="card">
      <div class="controls">
        <div class="row">
          <button id="useLocation">📍 使用我的位置</button>
          <div class="pill" id="locPill">尚未定位</div>
        </div>
        <div class="row">
          <label>緯度 <input id="lat" type="number" step="0.0001" placeholder="25.0"></label>
          <label>經度 <input id="lon" type="number" step="0.0001" placeholder="121.6"></label>
          <button id="fetchBtn">🌊 抓取海況</button>
        </div>
      </div>
      <div class="hr"></div>
      <div class="grid">
        <div>
          <div class="muted small">目前判定</div>
          <div id="status" class="status">—</div>
          <div class="small">分數 <span id="score" class="score">—</span> / 100</div>
          <div class="meter"><div id="bar" class="bar"></div></div>
        </div>
        <div>
          <div class="muted small">重點指標</div>
          <div class="badgelist" id="badges"></div>
        </div>
        <div>
          <div class="muted small">觀測時間</div>
          <div id="observedAt">—</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="grid">
        <div><div class="muted small">浪高 (m)</div><div id="waveHeight">—</div></div>
        <div><div class="muted small">風速 (m/s)</div><div id="windSpeed">—</div></div>
        <div><div class="muted small">降水/雷暴</div><div id="wx">—</div></div>
        <div><div class="muted small">其他</div><div id="extra">—</div></div>
      </div>
      <div class="hr"></div>
      <div class="tips" id="tips">
        小提醒：本工具僅供民眾近岸活動參考。若現場有紅旗或救生員勸導，請無條件遵從；遇雷雨或能見度差時，請避免下水。
      </div>
    </div>

    <footer>
      風險模型（簡化版）說明：浪高、風速、天氣警訊會加總成分數；
      <span class="good">≤30 低</span>、
      <span class="warn">31–60 中</span>、
      <span class="bad">>60 高</span>。
      實際狀況仍以現場為準。
    </footer>

    <!-- 返回主頁按鈕 -->
    <div style="text-align:center; margin:40px 0;">
      <a href="window.html" class="back-btn">⬅ 返回上一頁</a>
    </div>
  </div>

  <script>
    const $ = (id)=>document.getElementById(id)
    const locPill = $('locPill')
    const statusEl = $('status'), scoreEl=$('score'), bar=$('bar')
    const waveEl=$('waveHeight'), windEl=$('windSpeed'), wxEl=$('wx'), extraEl=$('extra'), badgesEl=$('badges'), obsEl=$('observedAt')

    function setBar(score){
      const pct = Math.max(0, Math.min(100, score)) / 100
      bar.style.scale = pct + ' 1'
      bar.className = 'bar ' + (score<=30? 'low' : score<=60? 'mid' : 'high')
      statusEl.className = 'status ' + (score<=30? 'low' : score<=60? 'mid' : 'high')
    }

    function wmoToText(code){
      const thunder = [95,96,99]
      if(thunder.includes(code)) return '雷暴 ⚡'
      const rain = [51,53,55,61,63,65,80,81,82]
      if(rain.includes(code)) return '降雨 🌧️'
      const drizzle = [56,57]
      if(drizzle.includes(code)) return '毛毛雨 🌦️'
      const snow = [71,73,75,77,85,86]
      if(snow.includes(code)) return '降雪 ❄️'
      const fog=[45,48]
      if(fog.includes(code)) return '霧 🌫️'
      return '晴到多雲'
    }

    function addBadge(text){
      const span = document.createElement('span')
      span.className='pill'
      span.textContent=text
      badgesEl.appendChild(span)
    }

    function computeRisk({waveHeight=0, wind=0, thunder=false, heavyRain=false}){
      let score = 0
      score += Math.min(2.5, Math.max(0, waveHeight)) * 30
      score += Math.min(20, Math.max(0, wind)) * 3
      if (thunder) score += 40
      if (heavyRain) score += 15
      score = Math.round(Math.min(100, score))
      const level = score<=30 ? '低（相對可下水）' : score<=60 ? '中（需謹慎）' : '高（不建議下水）'
      return {score, level}
    }

    async function fetchNow(lat, lon){
      badgesEl.innerHTML=''
      waveEl.textContent = windEl.textContent = wxEl.textContent = extraEl.textContent = '—'
      statusEl.textContent = '資料更新中…'

      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'Asia/Taipei'
      const wxUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&timezone=${encodeURIComponent(tz)}`
      const marineUrl = `https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}&hourly=wave_height,wind_wave_height,swell_wave_height,swell_wave_period&timezone=${encodeURIComponent(tz)}`

      let current = null, marine = null
      try{
        const [a,b] = await Promise.all([
          fetch(wxUrl).then(r=>r.json()),
          fetch(marineUrl).then(r=>r.json())
        ])
        current = a; marine = b
      }catch(e){
        statusEl.textContent='取得資料失敗，請稍後再試'
        return
      }

      const cw = current.current_weather || current.current || {}
      const wind = cw.windspeed ?? cw.wind_speed_10m ?? 0
      const wcode = cw.weathercode ?? cw.weather_code ?? 0
      const thunder = [95,96,99].includes(Number(wcode))
      const heavyRain = [63,65,82].includes(Number(wcode))

      let waveHeight = 0
      try{
        const hh = marine?.hourly || {}
        if (Array.isArray(hh?.wave_height) && hh.wave_height.length){
          waveHeight = Number(hh.wave_height[0])
        }
      }catch(e){}

      const {score, level} = computeRisk({waveHeight, wind, thunder, heavyRain})
      statusEl.textContent = level
      scoreEl.textContent = score
      setBar(score)

      waveEl.textContent = waveHeight ? waveHeight.toFixed(2) : '—'
      windEl.textContent = wind ? wind.toFixed(1) : '—'
      wxEl.textContent = wmoToText(Number(wcode))
      extraEl.textContent = thunder? '⚡ 伴隨雷暴' : heavyRain? '降雨偏強' : '—'
      obsEl.textContent = new Date().toLocaleString()

      if (waveHeight>=1.5) addBadge('浪高 ≥ 1.5m')
      else if (waveHeight>=0.5) addBadge('中等浪 (0.5–1.5m)')
      if (wind>=10) addBadge('風速 ≥ 10 m/s')
      if (thunder) addBadge('雷暴風險')
      if (heavyRain) addBadge('降雨偏強')
      if (!badgesEl.children.length) addBadge('條件尚可 ✅')
    }

    $('useLocation').addEventListener('click', ()=>{
      if (!navigator.geolocation){
        locPill.textContent='此裝置不支援定位'; return
      }
      locPill.textContent='定位中…'
      navigator.geolocation.getCurrentPosition(pos=>{
        const {latitude, longitude} = pos.coords
        $('lat').value = latitude.toFixed(4)
        $('lon').value = longitude.toFixed(4)
        locPill.textContent = `緯 ${latitude.toFixed(4)}，經 ${longitude.toFixed(4)}`
        fetchNow(latitude, longitude)
      }, err=>{
        locPill.textContent='無法取得定位（請允許權限或手動輸入）'
      }, {enableHighAccuracy:true, timeout:10000})
    })

    $('fetchBtn').addEventListener('click', ()=>{
      const lat = parseFloat($('lat').value)
      const lon = parseFloat($('lon').value)
      if (Number.isFinite(lat) && Number.isFinite(lon)){
        locPill.textContent = `緯 ${lat.toFixed(4)}，經 ${lon.toFixed(4)}`
        fetchNow(lat, lon)
      }
    })

    $('lat').value = 25.17
    $('lon').value = 121.44
  </script>
</body>
</html>
